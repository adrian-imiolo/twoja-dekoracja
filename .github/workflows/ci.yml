name: CI

# Every push, on every branch: a feature branch without an open PR still gets
# the same checks the default branch does.
on: push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # Playwright's webServer runs `next build`, so this step is also the
      # build check. A broken build fails here rather than at deploy time.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
